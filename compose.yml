services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dinely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: dinely
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dinely -d dinely']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVE_FRONTENDS: "true"
      DATABASE_URL: postgresql://dinely:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/dinely
      DIRECT_URL: postgresql://dinely:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/dinely
      BACKUP_DIRECTORY: /app/.data/backups
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 characters}
      PORT: 5000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    command: ['sh', '-c', 'node node_modules/prisma/build/index.js migrate deploy && exec node apps/api/dist/index.js']
    volumes: ['backup-data:/app/.data/backups']
    ports: ['127.0.0.1:5000:5000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  backup-data:
