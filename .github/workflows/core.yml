name: Core build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dinely
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: dinely_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dinely -d dinely_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dinely:test-only-password@localhost:5432/dinely_test
      INTEGRATION_DATABASE_URL: postgresql://dinely:test-only-password@localhost:5432/dinely_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:core

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup:env
      - run: docker compose up -d --build
      - run: node scripts/docker-smoke.mjs
      - run: docker compose exec -T -e BACKUP_SMOKE_TEST=true api node node_modules/tsx/dist/cli.mjs scripts/backup-smoke.ts
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=80 api
      - name: Stop isolated test containers
        if: always()
        run: docker compose down -v
